[package]
name = "mcp_backend"
version = "0.1.0"
publish = false        # internal crate; not published to crates.io
edition = "2024"
rust-version = "1.88"
license = "AGPL-3.0-only"
description = "SealGate backend REST client (policy, known fingerprints, server submit)."

[dependencies]
sealgate-detectord = { path = "../sealgate-detectord", default-features = false }
reqwest = { version = "0.12.16", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sha2 = "0.10.9"
thiserror = "2.0.18"
tracing = "0.1.44"

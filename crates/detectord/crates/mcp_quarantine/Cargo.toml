[package]
name = "mcp_quarantine"
version = "0.1.0"
publish = false        # internal crate; not published to crates.io
edition = "2024"
rust-version = "1.88"
license = "AGPL-3.0-only"
description = "Mutation, persistent state, and the reconcile planner for MCP quarantine."

[dependencies]
# Only the types + fingerprint are needed, not the concrete agents, so the
# agent features (and their rusqlite cost) are left off.
sealgate-detectord = { path = "../sealgate-detectord", default-features = false }
# Claude matches a hook group's `matcher` as a regex against the tool name,
# so deciding whether a group covers a binding means running one. String
# comparison cannot: `mcp__.*` and `mcp__*` select the same calls.
regex = "1.11.4"
rusqlite = { version = "0.40.1", features = ["bundled"] }
serde = { version = "1.0.228", features = ["derive"] }
# preserve_order keeps a config's existing server order through a read-modify-
# write (we no longer alphabetise on every edit). Comments/whitespace are still
# reformatted — full CST preservation is a separate, larger change.
serde_json = { version = "1.0.149", features = ["preserve_order"] }
serde_json_lenient = "0.2.4"
toml = "1.1.3"
thiserror = "2.0.18"
tracing = "0.1.44"

[dev-dependencies]
tempfile = "3.27.0"

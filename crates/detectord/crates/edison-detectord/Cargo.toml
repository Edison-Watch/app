[package]
name = "edison-detectord"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Watches MCP (Model Context Protocol) client configs and reports added or removed servers as they happen."
license = "AGPL-3.0-only"
readme = "../../README.md"
repository = "https://github.com/Edison-Watch/detectord"
homepage = "https://github.com/Edison-Watch/detectord"
keywords = ["mcp", "mcp-servers", "watcher", "config", "claude"]
categories = ["development-tools", "filesystem", "config"]

[features]
default = [
    "vscode",
    "claude_code",
    "cursor",
    "claude_desktop",
    "claude_cowork",
    "windsurf",
    "zed",
    "jetbrains",
    "codex",
]
# Each agent can be opted into independently. `vscode` and `cursor` pull in
# rusqlite (for reading `state.vscdb`) + serde_json_lenient (JSONC); `codex`
# pulls in `toml`; the plain single-file agents need no extra deps.
vscode = ["dep:rusqlite", "dep:serde_json_lenient"]
cursor = ["dep:rusqlite", "dep:serde_json_lenient"]
codex = ["dep:toml"]
claude_code = []
claude_desktop = []
claude_cowork = []
windsurf = []
zed = []
jetbrains = []

[dependencies]
dirs = "6.0.0"
notify = "8.2.0"
notify-debouncer-full = "0.7.0"
rusqlite = { version = "0.40.1", features = ["bundled"], optional = true }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sha2 = "0.10.8"
toml = { version = "0.9.8", optional = true }
serde_json_lenient = { version = "0.2.4", optional = true }
thiserror = "2.0.18"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[dev-dependencies]
tempfile = "3.27.0"

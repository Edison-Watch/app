[package]
name = "mcp_detector_daemon"
version = "0.1.0"
publish = false        # internal crate; not published to crates.io
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Long-lived daemon that watches MCP client configs and exposes status/events over a Unix socket."

[[bin]]
name = "mcp_detector_daemon"
path = "src/main.rs"

[dependencies]
mcp_detector_lib = { path = "../mcp_detector_lib" }
mcp_quarantine = { path = "../mcp_quarantine" }
mcp_backend = { path = "../mcp_backend" }
tokio = { version = "1.41", features = ["rt-multi-thread", "net", "signal", "time", "macros", "io-util", "sync"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
tracing-appender = "0.2.3"
dirs = "6.0.0"
thiserror = "2.0.18"
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
notify = "8.2.0"
notify-debouncer-full = "0.7.0"

# libc is only used by the Unix privilege/user code (getpwuid, setuid, chown,
# kill); cfg-gated out on Windows, which has no such model.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

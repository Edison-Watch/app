[package]
name = "mcp_detector_lib"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Watches MCP (Model Context Protocol) client configs and reports added or removed servers as they happen."
license = "MIT OR Apache-2.0"
readme = "README.md"
keywords = ["mcp", "model-context-protocol", "watcher", "config", "claude"]
categories = ["development-tools", "filesystem", "command-line-utilities"]

[features]
default = ["vscode", "claude_code"]
# Each client can be opted into independently. `vscode` pulls in rusqlite
# (for reading VSCode's `state.vscdb` workspace history); consumers who only
# care about Claude Code can disable it and skip that build cost entirely.
vscode = ["dep:rusqlite", "dep:serde_json_lenient"]
claude_code = []

[dependencies]
dirs = "6.0.0"
notify = "8.2.0"
notify-debouncer-full = "0.7.0"
rusqlite = { version = "0.39.0", features = ["bundled"], optional = true }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
serde_json_lenient = { version = "0.2.4", optional = true }
thiserror = "2.0.18"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[dev-dependencies]
tempfile = "3.27.0"

[[bin]]
name = "mcp_detector"
path = "src/main.rs"
required-features = ["vscode", "claude_code"]

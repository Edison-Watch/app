[package]
name = "mcp_detector"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Watches MCP (Model Context Protocol) client configs and reports added or removed servers as they happen."
license = "MIT OR Apache-2.0"
readme = "README.md"
keywords = ["mcp", "model-context-protocol", "watcher", "config", "claude"]
categories = ["development-tools", "filesystem", "command-line-utilities"]

[dependencies]
anyhow = "1.0.102"
dirs = "6.0.0"
notify = "8.2.0"
notify-debouncer-full = "0.7.0"
rusqlite = { version = "0.39.0", features = ["bundled"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
thiserror = "2.0.18"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[dev-dependencies]
tempfile = "3.27.0"

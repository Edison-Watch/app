# cargo-deny configuration. Run locally with `cargo deny check`; CI runs
# this on every push/PR.

[graph]
all-features = true

[advisories]
# Fail on known vulnerabilities. `yanked` warns so a single yanked
# transitive dep doesn't block the build until it's actually patched.
# `unmaintained = "workspace"` only flags advisories on direct deps.
yanked = "warn"
unmaintained = "workspace"
ignore = []

[licenses]
# Permissive-only allowlist. SPDX expressions in dependency manifests are
# expanded against this set. Add to it deliberately.
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "CC0-1.0",
    # webpki-roots (Mozilla CA bundle, via reqwest/rustls) ships under this
    # permissive data license.
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MPL-2.0",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
]
# First-party workspace crates are AGPL-3.0-only; the permissive-only
# allowlist above is for third-party dependencies.
exceptions = [
    { crate = "sealgate-detectord", allow = ["AGPL-3.0-only"] },
    { crate = "mcp_backend", allow = ["AGPL-3.0-only"] },
    { crate = "mcp_detector_daemon", allow = ["AGPL-3.0-only"] },
    { crate = "mcp_quarantine", allow = ["AGPL-3.0-only"] },
]
confidence-threshold = 0.93

[bans]
# Multiple versions of the same crate are common via transitive deps;
# warn rather than fail.
multiple-versions = "warn"
# Deny wildcard (`*`) version requirements on registry crates, but allow them
# for our own workspace-internal path deps (which have no published version).
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]

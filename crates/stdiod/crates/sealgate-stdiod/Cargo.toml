[package]
name = "sealgate-stdiod"
edition.workspace = true
version.workspace = true
license.workspace = true
authors.workspace = true
description = "SealGate stdio MCP server daemon - bridges local stdio MCP servers to the backend tunnel."
readme = "../../README.md"

[[bin]]
name = "sealgate-stdiod"
path = "src/main.rs"

[dependencies]
anyhow = { workspace = true }
base64 = { workspace = true }
chrono = { workspace = true }
clap = { workspace = true }
dirs = { workspace = true }
futures-util = { workspace = true }
getrandom = { workspace = true }
once_cell = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tokio-tungstenite = { workspace = true }
toml = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
sealgate-tunnel-protocol = { workspace = true }
url = "2"
webbrowser = { workspace = true }

# The Beeper setup steps (src/setup): verifying Beeper's installer signature,
# reading the machine architecture, and finding Beeper in the uninstall registry.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security_Cryptography",
    "Win32_Security_WinTrust",
    "Win32_System_Console",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_JobObjects",
    "Win32_System_Pipes",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
] }
winreg = "0.55"

[build-dependencies]
# build.rs parses packages/desktop/package.json to stamp the daemon version.
serde_json = { workspace = true }

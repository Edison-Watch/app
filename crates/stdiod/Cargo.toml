[workspace]
resolver = "2"
members = [
    "crates/sealgate-stdiod",
    "crates/sealgate-tunnel-protocol",
]

[workspace.package]
edition = "2021"
# Follows the desktop app release version (packages/desktop/package.json).
# Do not hand-edit: run `npm run version:sync` from the repo root after bumping
# the app, which rewrites this and both Cargo.lock files. CI fails on drift.
#
# Until this tracked the app, the daemon's own crate version (0.0.1) disagreed
# with the version it actually reports - build.rs stamps SEALGATE_DAEMON_VERSION
# from packages/desktop/package.json - so `--version` and Cargo.toml said
# different things. build.rs is now a fallback, not the mechanism.
version = "0.6.9"
license = "AGPL-3.0-only"
authors = ["SealGate"]
repository = "https://github.com/Edison-Watch/stdiod"
homepage = "https://github.com/Edison-Watch/stdiod"

[workspace.dependencies]
anyhow = "1"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
clap = { version = "4", features = ["derive", "env"] }
dirs = "6"
futures-util = "0.3"
getrandom = "0.3"
once_cell = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-webpki-roots", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = { version = "0.29", features = ["rustls-tls-webpki-roots"] }
toml = "1.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
webbrowser = "1"

# Workspace member crates
sealgate-tunnel-protocol = { path = "crates/sealgate-tunnel-protocol", version = "0.6.9" }

# One config for the whole monorepo. npm is a single root workspace (one
# lockfile), the two Rust daemons are independent Cargo workspaces.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      storybook:
        patterns:
          - storybook
          - '@storybook/*'
          - '@chromatic-com/storybook'
      testing:
        patterns:
          - vitest
          - '@vitest/*'
          - '@playwright/test'
          - '@testing-library/*'
          - jsdom
      build:
        patterns:
          - tsdown
          - typescript

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5

  - package-ecosystem: cargo
    directories:
      - /crates/stdiod
      - /crates/detectord
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      cargo-minor-patch:
        update-types:
          - minor
          - patch

name: CI (stdiod)

on:
  push:
    branches: [main]
    paths:
      - 'crates/stdiod/**'
      - '.github/workflows/stdiod-ci.yml'
  pull_request:
    paths:
      - 'crates/stdiod/**'
      - '.github/workflows/stdiod-ci.yml'
  workflow_dispatch:

# Cancel superseded runs on the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  test:
    name: build & test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: crates/stdiod
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # crates/stdiod/rust-toolchain.toml pins the channel + rustfmt/clippy components.
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master 2026-10-15
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: crates/stdiod
      # Prints only; installs nothing. The Windows installer has its own
      # workflow (stdiod-installer-windows.yml).
      - name: Installer script checks (install-beeper.sh)
        run: bash scripts/test-install-beeper.sh
      - name: AI writing check
        run: scripts/check_ai_writing.sh
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Build
        run: cargo build --workspace --verbose
      - name: Test
        run: cargo test --workspace --verbose

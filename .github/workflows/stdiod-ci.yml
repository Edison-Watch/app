name: CI (stdiod)

on:
  push:
    branches: [main]
    paths:
      - 'crates/stdiod/**'
      - '.github/workflows/stdiod-ci.yml'
  pull_request:
    paths:
      - 'crates/stdiod/**'
      - '.github/workflows/stdiod-ci.yml'
  workflow_dispatch:

# Cancel superseded runs on the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  test:
    name: build & test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: crates/stdiod
    steps:
      - uses: actions/checkout@v7
      # crates/stdiod/rust-toolchain.toml pins the channel + rustfmt/clippy components.
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/stdiod
      - name: AI writing check
        run: scripts/check_ai_writing.sh
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Build
        run: cargo build --workspace --verbose
      - name: Test
        run: cargo test --workspace --verbose

name: Build Windows (desktop, unsigned demo)

# Windows demo build, ported from the private monorepo's build-client-upstream
# windows job: stages the bundled Python + npx/uvx runtimes, natively builds
# edison-stdiod for both Windows arches from crates/stdiod, packages an
# unsigned NSIS installer versioned <base>-demo.<run>, sanity-checks the
# auto-update manifest, and uploads the installers as a workflow artifact.
#
# No publish step: this repo's auto-update rides the GitHub provider baked into
# electron-builder.yml (the monorepo's Cloudflare R2 generic feed does not
# apply here). Windows releases will join the GitHub-release flow alongside
# the macOS release workflows when Windows release jobs are added.
#
# Unsigned on purpose: NSIS auto-update verifies the package via the sha512 in
# latest.yml (not Authenticode), so updates apply unsigned - users only see a
# SmartScreen prompt on first install. Code signing is deferred until before
# public release.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'packages/desktop/**'
      - 'packages/shared/**'
      - 'crates/stdiod/**'
      - '.github/workflows/desktop-build-windows.yml'

concurrency:
  group: build-windows-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-windows-demo:
    name: Build Windows (Unsigned, demo)
    runs-on: windows-latest
    # This natively builds edison-stdiod for both arches (release `ring`
    # C-crypto compile) and stages the npx/uvx runtimes.
    timeout-minutes: 45
    # Git Bash for the scripted steps. The Python/runtime staging steps run
    # via npm scripts (-> pwsh).
    defaults:
      run:
        shell: bash
        working-directory: packages/desktop
    env:
      # Demo backend config (DEMO_VITE_* repository variables).
      VITE_DEPLOY_ENV: ${{ vars.DEMO_VITE_DEPLOY_ENV }}
      VITE_API_BASE_URL: ${{ vars.DEMO_VITE_API_BASE_URL }}
      VITE_MCP_BASE_URL: ${{ vars.DEMO_VITE_MCP_BASE_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies (workspace root)
        run: npm ci
        working-directory: .

      - name: Build @edison-watch/shared
        run: npm run build -w packages/shared
        working-directory: .

      - name: Stage bundled Python (x64 + arm64)
        # Downloads + SHA256-verifies the embeddable interpreter into
        # bin/python/<arch>/; win.extraResources copies the matching arch into
        # resources/python/. The session hooks need a Python runtime Windows
        # does not reliably provide. Runs via npm script (-> pwsh).
        run: npm run stage:python

      - name: Build edison-stdiod (x64 + arm64)
        # Native per-arch cargo build on the Windows runner. Staged into
        # packages/desktop/bin/stdiod/<arch>/ so win.extraResources copies the
        # matching-arch edison-stdiod.exe into resources/bin/. Without this the
        # packaged app ships with no stdio daemon.
        working-directory: crates/stdiod
        run: |
          set -euo pipefail
          rustup target add x86_64-pc-windows-msvc aarch64-pc-windows-msvc
          for spec in "x64:x86_64-pc-windows-msvc" "arm64:aarch64-pc-windows-msvc"; do
            arch="${spec%%:*}"
            target="${spec##*:}"
            echo "Building edison-stdiod for $target ..."
            cargo build --release --target "$target" --bin edison-stdiod
            mkdir -p "../../packages/desktop/bin/stdiod/$arch"
            cp "target/$target/release/edison-stdiod.exe" "../../packages/desktop/bin/stdiod/$arch/edison-stdiod.exe"
          done

      - name: Stage bundled runtimes (npx/uvx, x64 + arm64)
        # Downloads Node (npx) + uv (uvx) into bin/runtimes/<arch>/;
        # win.extraResources copies the matching arch into resources/runtimes/.
        # The stdiod daemon spawns child MCP servers via npx/uvx, which Windows
        # users often lack. Runs via the npm script (-> pwsh). Mirrors `build:win`.
        run: npm run stage:runtimes

      - name: Build Electron app (unsigned, demo)
        # Version is <base>-demo.<run> so the demo feed advances per run.
        run: |
          BASE=$(node -p "require('./package.json').version")
          VERSION="${BASE}-demo.${GITHUB_RUN_NUMBER}"
          echo "Building demo version $VERSION"
          npm run build:demo
          npx electron-builder --win --publish never \
            -c.extraMetadata.version="$VERSION"

      - name: Verify update artifacts (auto-update sanity)
        # Fail BEFORE publishing a broken build: a wrong version in latest.yml or
        # a missing installer silently breaks electron-updater on Windows.
        run: |
          set -euo pipefail
          BASE=$(node -p "require('./package.json').version")
          VERSION="${BASE}-demo.${GITHUB_RUN_NUMBER}"
          YML="dist/latest.yml"
          test -f "$YML" || { echo "::error::dist/latest.yml missing"; exit 1; }
          MVER=$(grep -m1 '^version:' "$YML" | awk '{print $2}' | tr -d '\r')
          [ "$MVER" = "$VERSION" ] || { echo "::error::manifest version '$MVER' != build version '$VERSION'"; exit 1; }
          ls dist/*.exe >/dev/null 2>&1 || { echo "::error::no NSIS installer (.exe) produced"; exit 1; }
          echo "manifest version: $MVER"
          for f in dist/*.exe; do
            SIZE_MB=$(( $(wc -c < "$f") / 1024 / 1024 )); echo "installer: $(basename "$f") (${SIZE_MB} MB)"
          done

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v7
        with:
          name: edison-watch-windows-demo
          path: |
            packages/desktop/dist/*.exe
            packages/desktop/dist/latest.yml
          if-no-files-found: error
          retention-days: 14

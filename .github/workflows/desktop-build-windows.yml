name: Build Windows (desktop, unsigned demo)

# Windows demo build, ported from the private monorepo's build-client-upstream
# windows job. One job per arch: stages that arch's bundled Python + npx/uvx
# runtimes, natively builds sealgate-stdiod + sealgate-detectord for it from
# crates/, packages an unsigned single-arch NSIS installer versioned
# <base>-demo.<run>, sanity-checks the auto-update manifest, and uploads the
# installer as a per-arch workflow artifact.
#
# No publish step: this workflow is the per-push CI gate + test-artifact
# builder only. Published Windows releases come from the windows jobs in
# desktop-release.yml (stable) and desktop-release-demo.yml (demo), which
# mirror these build steps and upload into the shared GitHub Release that
# auto-update rides (the GitHub provider baked into electron-builder.yml).
#
# Unsigned on purpose: NSIS auto-update verifies the package via the sha512 in
# latest.yml (not Authenticode), so updates apply unsigned - users only see a
# SmartScreen prompt on first install. Code signing is deferred until before
# public release.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'packages/desktop/**'
      - 'packages/shared/**'
      - 'crates/stdiod/**'
      - 'crates/detectord/**'
      - '.github/workflows/desktop-build-windows.yml'

concurrency:
  group: build-windows-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-windows-demo:
    name: Build Windows ${{ matrix.arch }} (Unsigned, demo)
    runs-on: windows-latest
    # Each leg natively builds sealgate-stdiod + sealgate-detectord for its own arch
    # (release `ring` C-crypto compile) and stages that arch's npx/uvx runtimes.
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # `channel` mirrors desktop-release.yml's windows job so this gate
        # produces the same manifest layout a release would - electron-builder
        # does not arch-suffix Windows manifests, so arm64 rides its own channel.
        include:
          - arch: x64
            target: x86_64-pc-windows-msvc
            channel: latest
            manifest: latest.yml
            unpacked: win-unpacked
          - arch: arm64
            target: aarch64-pc-windows-msvc
            channel: latest-arm64
            manifest: latest-arm64.yml
            unpacked: win-arm64-unpacked
    # Git Bash for the scripted steps. The Python/runtime staging steps run
    # via npm scripts (-> pwsh).
    defaults:
      run:
        shell: bash
        working-directory: packages/desktop
    env:
      # Demo backend config (DEMO_VITE_* repository variables).
      VITE_DEPLOY_ENV: ${{ vars.DEMO_VITE_DEPLOY_ENV }}
      VITE_API_BASE_URL: ${{ vars.DEMO_VITE_API_BASE_URL }}
      VITE_MCP_BASE_URL: ${{ vars.DEMO_VITE_MCP_BASE_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies (workspace root)
        run: npm ci
        working-directory: .

      - name: Build @sealgate/shared
        run: npm run build -w packages/shared
        working-directory: .

      - name: Stage bundled Python (${{ matrix.arch }})
        # Downloads + SHA256-verifies the embeddable interpreter into
        # bin/python/<arch>/; win.extraResources copies the matching arch into
        # resources/python/. The session hooks need a Python runtime Windows
        # does not reliably provide. Runs via npm script (-> pwsh).
        run: npm run stage:python -- -Arch ${{ matrix.arch }}

      - uses: Swatinem/rust-cache@v2
        with:
          # Same per-arch cache as the windows legs in desktop-release.yml and
          # desktop-release-demo.yml - see the note there. This per-push job is
          # the one that keeps it warm on main for the release workflows.
          shared-key: windows-daemons-${{ matrix.arch }}
          workspaces: |
            crates/detectord
            crates/stdiod

      - name: Build sealgate-stdiod (${{ matrix.arch }})
        # Native cargo build on the Windows runner, this leg's arch only. Staged
        # into packages/desktop/bin/stdiod/<arch>/ so win.extraResources copies
        # the matching-arch sealgate-stdiod.exe into resources/bin/. Without this
        # the packaged app ships with no stdio daemon.
        working-directory: crates/stdiod
        run: |
          set -euo pipefail
          rustup target add ${{ matrix.target }}
          echo "Building sealgate-stdiod for ${{ matrix.target }} ..."
          cargo build --release --target "${{ matrix.target }}" --bin sealgate-stdiod
          mkdir -p "../../packages/desktop/bin/stdiod/${{ matrix.arch }}"
          cp "target/${{ matrix.target }}/release/sealgate-stdiod.exe" \
            "../../packages/desktop/bin/stdiod/${{ matrix.arch }}/sealgate-stdiod.exe"

      - name: Build sealgate-detectord (${{ matrix.arch }})
        # Same native pattern as stdiod above. The cargo binary is
        # mcp_detector_daemon; win.extraResources expects it staged as
        # bin/detectord/<arch>/sealgate-detectord.exe. Without this the packaged
        # app ships without the detector daemon (electron-builder only warns).
        working-directory: crates/detectord
        run: |
          set -euo pipefail
          rustup target add ${{ matrix.target }}
          echo "Building mcp_detector_daemon for ${{ matrix.target }} ..."
          cargo build --release --target "${{ matrix.target }}" --bin mcp_detector_daemon
          mkdir -p "../../packages/desktop/bin/detectord/${{ matrix.arch }}"
          cp "target/${{ matrix.target }}/release/mcp_detector_daemon.exe" \
            "../../packages/desktop/bin/detectord/${{ matrix.arch }}/sealgate-detectord.exe"

      - name: Stage bundled runtimes (npx/uvx, ${{ matrix.arch }})
        # Downloads Node (npx) + uv (uvx) into bin/runtimes/<arch>/;
        # win.extraResources copies the matching arch into resources/runtimes/.
        # The stdiod daemon spawns child MCP servers via npx/uvx, which Windows
        # users often lack. Runs via the npm script (-> pwsh). Mirrors
        # `build:win:${{ matrix.arch }}`.
        run: npm run stage:runtimes -- -Arch ${{ matrix.arch }}

      - name: Build Electron app (unsigned, demo)
        # Version is <base>-demo.<run> so the demo feed advances per run.
        run: |
          BASE=$(node -p "require('./package.json').version")
          VERSION="${BASE}-demo.${GITHUB_RUN_NUMBER}"
          echo "Building demo version $VERSION (${{ matrix.arch }})"
          npm run build:demo
          npx electron-builder --win --${{ matrix.arch }} --publish never \
            -c.win.target=nsis \
            -c.extraMetadata.version="$VERSION" \
            -c.publish.channel=${{ matrix.channel }}

      - name: Verify bundled daemons
        # electron-builder treats a missing extraResources source as a warning,
        # so assert both daemons actually made it into the packaged app.
        run: |
          set -euo pipefail
          for bin in sealgate-stdiod.exe sealgate-detectord.exe; do
            found="dist/${{ matrix.unpacked }}/resources/bin/$bin"
            test -f "$found" || { echo "::error::$bin missing from $found"; exit 1; }
            echo "bundled: $found"
          done

      - name: Verify update artifacts (auto-update sanity)
        # Fail BEFORE publishing a broken build: a wrong version in the manifest
        # or a missing installer silently breaks electron-updater on Windows.
        run: |
          set -euo pipefail
          BASE=$(node -p "require('./package.json').version")
          VERSION="${BASE}-demo.${GITHUB_RUN_NUMBER}"
          YML="dist/${{ matrix.manifest }}"
          test -f "$YML" || { echo "::error::$YML missing"; exit 1; }
          MVER=$(grep -m1 '^version:' "$YML" | awk '{print $2}' | tr -d '\r')
          [ "$MVER" = "$VERSION" ] || { echo "::error::manifest version '$MVER' != build version '$VERSION'"; exit 1; }
          ls dist/*-${{ matrix.arch }}-setup.exe >/dev/null 2>&1 || {
            echo "::error::no ${{ matrix.arch }} NSIS installer produced"; exit 1; }
          echo "manifest version: $MVER"
          for f in dist/*-${{ matrix.arch }}-setup.exe; do
            SIZE_MB=$(( $(wc -c < "$f") / 1024 / 1024 )); echo "installer: $(basename "$f") (${SIZE_MB} MB)"
          done

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v7
        with:
          # Per-arch name: two legs uploading the same artifact name would
          # collide (upload-artifact v4+ rejects duplicates).
          name: sealgate-windows-demo-${{ matrix.arch }}
          path: |
            packages/desktop/dist/*-${{ matrix.arch }}-setup.exe
            packages/desktop/dist/${{ matrix.manifest }}
          if-no-files-found: error
          retention-days: 14

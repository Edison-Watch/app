name: CI (desktop)

# Typecheck + unit tests + coverage + an Electron startup smoke test for the
# desktop app. Replaces the client job of the private monorepo's
# "CI - v2 Packages" and its phase2-electron e2e smoke.

on:
  pull_request:
    paths:
      - 'packages/desktop/**'
      - 'packages/shared/**'
      - 'package-lock.json'
      - '.github/workflows/desktop-ci.yaml'
  push:
    branches: [main]
    paths:
      - 'packages/desktop/**'
      - 'packages/shared/**'
      - 'package-lock.json'
      - '.github/workflows/desktop-ci.yaml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: packages/desktop
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      # --ignore-scripts skips the Electron binary download; typecheck and
      # vitest run against the types only.
      - name: Install dependencies (workspace root)
        run: npm ci --ignore-scripts
        working-directory: .

      - name: Build @sealgate/shared
        run: npm run build -w packages/shared
        working-directory: .

      - run: npm run typecheck
      - run: npm run test:coverage

      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-desktop
          path: packages/desktop/coverage/coverage-summary.json
          retention-days: 1

  e2e-smoke:
    name: Electron startup smoke (setup wizard)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: packages/desktop
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      # Full install: the e2e harness launches the real Electron binary.
      - name: Install dependencies (workspace root)
        run: npm ci
        working-directory: .

      - name: Build @sealgate/shared
        run: npm run build -w packages/shared
        working-directory: .

      - name: Build the app bundles
        run: npm run build

      - name: Run Electron e2e under Xvfb
        run: xvfb-run --auto-servernum --server-args="-screen 0 1280x720x24" npm run test:e2e

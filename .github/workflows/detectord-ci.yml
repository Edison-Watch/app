name: CI (detectord)

on:
  push:
    branches: [main]
    paths:
      - 'crates/detectord/**'
      - '.github/workflows/detectord-ci.yml'
  pull_request:
    paths:
      - 'crates/detectord/**'
      - '.github/workflows/detectord-ci.yml'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: crates/detectord
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: crates/detectord
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/detectord
      - run: cargo clippy --all-targets --all-features -- -D warnings

  test:
    name: test (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: crates/detectord
    strategy:
      fail-fast: false
      matrix:
        include:
          # Default features run the full suite (lib + integration) on both
          # Linux (inotify) and macOS (FSEvents) - the integration tests
          # actually exercise the platform-specific filesystem watcher.
          - name: default features (linux)
            os: ubuntu-latest
            flags: ""
            cargo_test: test
          - name: default features (macos)
            os: macos-latest
            flags: ""
            cargo_test: test
          # Single-feature permutations only need to verify the feature gates
          # compile and the lib unit tests still pass; one OS is sufficient.
          - name: no default features
            os: ubuntu-latest
            flags: --no-default-features
            cargo_test: test --lib
          - name: vscode only
            os: ubuntu-latest
            flags: --no-default-features --features vscode
            cargo_test: test --lib
          - name: claude_code only
            os: ubuntu-latest
            flags: --no-default-features --features claude_code
            cargo_test: test --lib
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/detectord
      - run: cargo ${{ matrix.cargo_test }} ${{ matrix.flags }}

  doctests:
    name: doctests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: crates/detectord
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/detectord
      - run: cargo test --doc

  doc:
    name: rustdoc
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: crates/detectord
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/detectord
      - run: cargo doc --no-deps --all-features

  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          manifest-path: crates/detectord/Cargo.toml
          command: check advisories bans licenses sources

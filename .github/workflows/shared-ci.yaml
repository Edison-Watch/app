name: CI (shared)

on:
  pull_request:
    paths:
      - 'packages/shared/**'
      - 'package-lock.json'
      - '.github/workflows/shared-ci.yaml'
  push:
    branches: [main]
    paths:
      - 'packages/shared/**'
      - 'package-lock.json'
      - '.github/workflows/shared-ci.yaml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write

jobs:
  ai-writing:
    name: AI Writing Check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: packages/shared
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun scripts/check-ai-writing.ts

  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: packages/shared
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      # Workspace install must run from the repo root (single root lockfile).
      - run: npm ci
        working-directory: .
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm run knip
      - run: npm run test:coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: packages/shared/coverage/lcov.info
          flags: unit
          use_oidc: true

      - run: npm run build
      - run: npm run build-storybook

      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: packages/shared/coverage/coverage-summary.json
          retention-days: 1

  compatibility:
    name: Node 24 compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: packages/shared
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - run: npm ci
        working-directory: .
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm run knip
      - run: npm run test
      - run: npm run build
      - run: npm run build-storybook

name: Folder Size Check (desktop)
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'packages/desktop/**.ts'
      - 'packages/desktop/**.tsx'
      - 'packages/desktop/**.js'
      - 'packages/desktop/**.jsx'
      - 'packages/desktop/**.mjs'
      - 'packages/desktop/**.cjs'

jobs:
  check-folder-sizes:
    name: Folder Size Check (desktop)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/desktop
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - name: Run check
        run: |
          if [ -n "${{ github.event.pull_request.base.sha }}" ]; then
            # --relative scopes the diff to this component and strips the path prefix.
            mapfile -t files < <(git diff --name-only --diff-filter=d --relative "${{ github.event.pull_request.base.sha }}...HEAD")
            [ "${#files[@]}" -eq 0 ] && { echo "No files changed."; exit 0; }
            scripts/check_folder_sizes.sh "${files[@]}"
          else
            scripts/check_folder_sizes.sh --all
          fi

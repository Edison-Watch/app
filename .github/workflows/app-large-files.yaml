name: Large File Check (app)
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'packages/app/**.ts'
      - 'packages/app/**.tsx'
      - 'packages/app/**.js'
      - 'packages/app/**.jsx'
      - 'packages/app/**.mjs'
      - 'packages/app/**.cjs'

jobs:
  check-file-sizes:
    name: Large File Check (app)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/app
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - name: Run check
        run: |
          if [ -n "${{ github.event.pull_request.base.sha }}" ]; then
            # --relative scopes the diff to this component and strips the path prefix.
            mapfile -t files < <(git diff --name-only --diff-filter=d --relative "${{ github.event.pull_request.base.sha }}...HEAD")
            [ "${#files[@]}" -eq 0 ] && { echo "No files changed."; exit 0; }
            scripts/check_large_files.sh "${files[@]}"
          else
            scripts/check_large_files.sh --all
          fi

name: Build macOS (desktop)

# Upstream TEST build - NOT a release.
# Builds both daemons (sealgate-stdiod, sealgate-detectord) from source out of
# crates/, bundles them, and produces a .dmg/.zip uploaded as an Actions
# artifact.
#
# Signing depends on the trigger:
#   - pull_request: UNSIGNED. Code signing is the slow part of the build and
#     needs the CSC_* secrets, which GitHub withholds from fork/dependabot PRs -
#     so signing PR builds is both wasteful and impossible there. We skip it so
#     every PR (including dependabot) gets a green gate + a downloadable artifact.
#   - push to main (post-merge): SIGNED (Developer ID) but NOT notarized. Secrets
#     are available on same-repo push events, so we sign here to produce a
#     signed artifact. Notarization is skipped on purpose - it adds a multi-minute
#     Apple round-trip and isn't needed to verify the build/sign pipeline.
#
# Either way the artifact is un-notarized, so it's Gatekeeper-blocked on other
# machines (run `xattr -dr com.apple.quarantine` to launch) and won't auto-update
# - that's fine for testing. Real, notarized, published releases come from
# desktop-release.yml / desktop-release-demo.yml.

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'packages/**'
      # Both daemons are built from source here, so their crates gate this too.
      - 'crates/stdiod/**'
      - 'crates/detectord/**'
      - 'package-lock.json'
      - '.github/workflows/desktop-build-macos.yml'
  push:
    branches: [main]
    paths:
      - 'packages/**'
      # Both daemons are built from source here, so their crates gate this too.
      - 'crates/stdiod/**'
      - 'crates/detectord/**'
      - 'package-lock.json'
      - '.github/workflows/desktop-build-macos.yml'

concurrency:
  group: build-macos-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build (arm64)
    runs-on: macos-latest # arm64; the only macOS arch shipped
    defaults:
      run:
        working-directory: packages/desktop
    env:
      # Sign on post-merge push to main and on manual dispatch; PR builds stay
      # unsigned (see header). On pull_request these resolve to empty / false so
      # electron-builder skips signing entirely instead of erroring on a missing
      # certificate.
      # Allow-list, not `!= 'pull_request'`: any trigger added later must opt in
      # to the signing cert deliberately. A deny-list would hand it to, say, a
      # future pull_request_target run, which builds fork-authored code.
      CSC_LINK: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && secrets.CSC_LINK || '' }}
      CSC_KEY_PASSWORD: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && secrets.CSC_KEY_PASSWORD || '' }}
      # false => electron-builder produces an unsigned build without probing the
      # keychain for a Developer ID identity (none exists on PR runs).
      CSC_IDENTITY_AUTO_DISCOVERY: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && secrets.CSC_LINK != '' }}
      # Demo backend config. Vite's loadEnv() also reads matching keys from the
      # environment, so these flow into the bundle even without ../frontend-v2.
      # Set the DEMO_VITE_* repository variables (Settings > Variables).
      VITE_DEPLOY_ENV: ${{ vars.DEMO_VITE_DEPLOY_ENV }}
      VITE_API_BASE_URL: ${{ vars.DEMO_VITE_API_BASE_URL }}
      VITE_MCP_BASE_URL: ${{ vars.DEMO_VITE_MCP_BASE_URL }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      # The Electron runtime electron-builder downloads is pinned by electronVersion
      # in electron-builder.yml (independent of the resolved `electron` devDep), so
      # the cache below keys on that value.
      - name: Resolve Electron runtime version (cache key)
        id: electron
        run: echo "version=$(grep '^electronVersion:' electron-builder.yml | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      # Electron binaries (~100 MB/arch) + app-builder tools - the big download win.
      # Keyed on the Electron runtime version, NOT package-lock.json: these binaries
      # only change when Electron is upgraded, so an unrelated dependency bump (the
      # common dependabot case) no longer needlessly re-downloads ~200 MB. The npm
      # dependencies themselves are cached separately by setup-node's `cache: npm`.
      - name: Cache electron-builder downloads
        uses: actions/cache@v6
        with:
          path: |
            ~/Library/Caches/electron
            ~/Library/Caches/electron-builder
          key: ${{ runner.os }}-electron-${{ steps.electron.outputs.version }}
          restore-keys: ${{ runner.os }}-electron-

      - name: Install dependencies (workspace root)
        run: npm ci
        working-directory: .

      # The app consumes the workspace-linked @sealgate/shared, whose
      # package entry points live in dist/ - build it first.
      - name: Build @sealgate/shared
        run: npm run build -w packages/shared
        working-directory: .

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          # Shared with the macOS jobs in desktop-release.yml and
          # desktop-release-demo.yml: all three compile the same two crates for
          # the same two Darwin targets, so without this they would each keep a
          # separate cache (rust-cache folds the job name into the key by
          # default) and a release build could never reuse the cache this
          # per-push job keeps warm on main.
          shared-key: macos-daemons
          workspaces: |
            crates/detectord
            crates/stdiod

      - name: Build sealgate-detectord from source
        # Stages crates/detectord's daemon into bin/sealgate-detectord (arm64).
        # mac.extraResources expects it; electron-builder only WARNS when the
        # file is missing, which is how releases shipped without the detector
        # daemon until 0.6.0.
        run: npm run build:detectord

      - name: Build sealgate-stdiod from source (arm64)
        # Built from the checkout, same as detectord - so this gate actually
        # tests the stdiod source at this commit instead of the last published
        # binary. The script stages a thin arm64 binary at bin/sealgate-stdiod
        # for mac.extraResources.
        run: npm run build:stdiod

      - name: Report bundled stdiod architecture
        run: lipo -info bin/sealgate-stdiod

      - name: Build renderer/main/preload bundles
        run: npm run build:demo

      - name: Package (arm64, no notarization, no publish)
        # A defined-but-empty CSC_LINK is treated as a certificate *path* by
        # electron-builder (>= 26.x) and resolved to the project dir -> "not a
        # file". Unset the signing vars entirely when there's nothing in them.
        run: |
          if [ -z "${CSC_LINK}" ]; then unset CSC_LINK CSC_KEY_PASSWORD; fi
          npx electron-builder --mac --publish never -c.mac.notarize=false

      - name: Verify bundled daemons
        # electron-builder treats a missing extraResources source as a warning,
        # so assert both daemons made it into the bundle.
        #
        # The arch check is inverted from what it used to be: these MUST be thin
        # arm64, never `lipo`-merged. A merged Mach-O carries an unsigned x86_64
        # slice, which leaves the whole file with no designated requirement -
        # tccd then writes permission grants it can never re-verify, and the user
        # gets the same folder-access dialog forever.
        run: |
          set -euo pipefail
          shopt -s nullglob
          apps=(dist/mac-arm64/*.app)
          [ ${#apps[@]} -eq 1 ] || {
            echo "::error::expected 1 arm64 .app bundle, found ${#apps[@]}"; exit 1; }
          for app in "${apps[@]}"; do
            for bin in sealgate-stdiod sealgate-detectord; do
              f="$app/Contents/Resources/bin/$bin"
              test -f "$f" || { echo "::error::$bin missing from $app"; exit 1; }
              info=$(lipo -info "$f")
              case "$info" in
                *x86_64*) echo "::error::$f must be thin arm64, got: $info"; exit 1 ;;
                *arm64*) ;;
                *) echo "::error::$f is not arm64: $info"; exit 1 ;;
              esac
              codesign -d -r- "$f" 2>&1 | grep -q '^# designated' || {
                echo "::error::$f has no designated requirement; TCC grants will not stick"
                exit 1; }
              echo "bundled: $f -> $info"
            done
          done

      - name: Upload app artifact
        uses: actions/upload-artifact@v7
        with:
          name: sealgate-macos
          path: |
            packages/desktop/dist/*.dmg
            packages/desktop/dist/*.zip
          if-no-files-found: error
          retention-days: 14

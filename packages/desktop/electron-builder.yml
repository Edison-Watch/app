appId: com.sealgate.desktop
productName: SealGate
protocols:
  - name: SealGate
    schemes: [sealgate]
directories:
  buildResources: build
  output: dist
files:
  # Exclude build output dirs so a prior build's artifacts are never packed into
  # the asar. electron-builder auto-excludes `directories.output`, but a custom
  # `-c.directories.output=...` (e.g. the local auto-update test harness) leaves
  # the default `dist/` un-excluded - without this it recursively bundles old
  # builds and the app balloons to >1GB (which then breaks Squirrel auto-update).
  - '!dist'
  - '!dist-*'
  - '!**/.vscode/*'
  - '!**/.storybook/*'
  - '!src/*'
  - '!tests'
  - '!e2e'
  - '!scripts'
  - '!**/*.{map,tsbuildinfo}'
  - '!{vitest.config.ts,playwright.config.ts,playwright.visual.config.ts}'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
asarUnpack:
  - resources/**
win:
  executableName: SealGate
  icon: resources/icon.ico
  # Bundled Python for the session hooks, staged by scripts/stage-python.ps1.
  # e.g. bin/python/x64 -> resources/python/python.exe
  extraResources:
    - from: bin/python/${arch}
      to: python
    # stdiod daemon (staged by scripts/build-stdiod-win.sh) -> resources/bin/.
    - from: bin/stdiod/${arch}/sealgate-stdiod.exe
      to: bin/sealgate-stdiod.exe
    # detector daemon (staged by scripts/build-detectord-win.sh) -> resources/bin/.
    - from: bin/detectord/${arch}/sealgate-detectord.exe
      to: bin/sealgate-detectord.exe
    # Node (npx) + uv (uvx) for the daemon's child MCP servers, staged by
    # scripts/stage-runtimes.ps1 -> resources/runtimes/{node,uv}.
    - from: bin/runtimes/${arch}
      to: runtimes
  target:
    - target: nsis
      arch:
        - x64
        - arm64
nsis:
  oneClick: false
  perMachine: false
  allowElevation: false
  allowToChangeInstallationDirectory: true
  artifactName: SealGate-${version}-${arch}-setup.${ext}
  shortcutName: SealGate
  uninstallDisplayName: SealGate
  createDesktopShortcut: always
  createStartMenuShortcut: true
  menuCategory: true
mac:
  icon: resources/icon.icns
  category: public.app-category.developer-tools
  # Bundle the sealgate-stdiod + sealgate-detectord daemons directly into
  # Contents/Resources/bin/. BOTH daemons must be staged as UNIVERSAL Mach-O
  # binaries (scripts/build-stdiod.sh, scripts/build-detectord.sh): the .app is
  # built for arm64 AND x64, and these single `from:` paths are copied verbatim
  # into both bundles - a thin arm64 daemon would leave the Intel build unable to
  # exec it. @electron/osx-sign signs nested executables in Contents/Resources
  # automatically when hardenedRuntime: true, inheriting entitlements from
  # entitlementsInherit, so no afterPack hook is needed here.
  extraResources:
    - from: bin/sealgate-stdiod
      to: bin/sealgate-stdiod
    - from: bin/sealgate-detectord
      to: bin/sealgate-detectord
  # Separate per-arch .app/.dmg/.zip rather than one merged `universal` target:
  # each artifact name carries its arch, which is what electron-updater matches
  # against process.arch when picking a download out of latest-mac.yml. Both
  # arches are produced by a SINGLE electron-builder run, so they land in one
  # shared latest-mac.yml listing both zips (macOS update manifests are not
  # arch-suffixed - see the windows job note in .github/workflows/desktop-release.yml).
  target:
    - target: dmg
      arch:
        - arm64
        - x64
    - target: zip
      arch:
        - arm64
        - x64
  entitlements: resources/entitlements.mac.plist
  entitlementsInherit: resources/entitlements.mac.plist
  hardenedRuntime: true
  gatekeeperAssess: false
  extendInfo:
    # Usage strings for TCC-gated resources the app never touches. A null value
    # DELETES the key from the generated Info.plist (electron-builder assigns
    # nulls through deepAssign, then strips null entries), which is the only way
    # to drop the ones electron-builder injects by default.
    #
    # Camera / microphone / audio capture: never used, pure boilerplate.
    #
    # Documents / Downloads: the app used to enumerate the user's project
    # directories (Claude Code's projects map, Cursor + VSCode workspaces) to
    # find project-scoped MCP configs, and a project under ~/Documents or
    # ~/Downloads made macOS prompt. That work now lives entirely in the
    # detector daemon, which reaches those paths under its OWN code signature -
    # a usage string here cannot speak for it. Nothing in this bundle opens a
    # path inside a user project directory any more, so the app can no longer
    # trigger those prompts. If that ever changes, restore these keys WITH
    # copy that explains the access, and add NSDesktopFolderUsageDescription.
    NSCameraUsageDescription: null
    NSMicrophoneUsageDescription: null
    NSAudioCaptureUsageDescription: null
    NSDocumentsFolderUsageDescription: null
    NSDownloadsFolderUsageDescription: null
    NSUserNotificationAlertStyle: alert
  notarize: false
dmg:
  # MUST carry ${arch}: two arches are built in one run, and without it both
  # .dmg files resolve to the same name and the second overwrites the first.
  artifactName: SealGate-${version}-mac-${arch}.${ext}
  title: SealGate ${version}
  contents:
    - x: 130
      y: 220
    - x: 410
      y: 220
      type: link
      path: /Applications
linux:
  icon: resources/icon.png
  category: Development
  # REQUIRED. Without it electron-builder derives the executable name from the
  # package name (@sealgate/desktop) and AppImage packaging hard-fails:
  # "executableName contains characters that cannot be safely used in file
  # paths: @sealgatedesktop". The win block sets its own executableName and
  # mac uses productName, which is why only Linux tripped over this. Nothing
  # depends on the value - the self-installed .desktop entry execs $APPIMAGE
  # directly (see runtime/desktopIntegration.ts) - so it just has to be a sane
  # path-safe name; matches ~/.local/share/sealgate and sealgate.desktop.
  executableName: sealgate
  # Bundle the sealgate-stdiod + sealgate-detectord daemons (static musl binaries,
  # staged per-arch by scripts/build-stdiod-linux.sh and build-detectord-linux.sh)
  # into resources/bin/. Mirrors the win rule. The bundled-path helpers
  # (getBundled{Stdiod,Detectord}BinaryPath) resolve here via process.resourcesPath,
  # but on Linux they are the *source* for staging, not the run path: the public
  # get{Stdiod,Detectord}BinaryPath() getters return a stable per-user copy under
  # ~/.local/share/sealgate/bin, since the AppImage mount (and thus
  # resourcesPath) is ephemeral and changes every launch. See runtime/stdiodBinary.ts
  # and detectord/binary.ts.
  # Unlike Windows we do NOT bundle Node/uv runtimes - Linux users get npx/uvx
  # from PATH (the systemd unit seeds a sensible PATH), matching the macOS app.
  extraResources:
    - from: bin/stdiod/${arch}/sealgate-stdiod
      to: bin/sealgate-stdiod
    - from: bin/detectord/${arch}/sealgate-detectord
      to: bin/sealgate-detectord
  target:
    - target: AppImage
      arch:
        - x64
        - arm64
appImage:
  artifactName: SealGate-${version}-${arch}.${ext}
# Use the modern STATIC AppImage runtime instead of the legacy one. The legacy
# runtime dynamically loads libfuse2 + libz.so from the host, which a base
# Ubuntu lacks (the recurring "libz.so / FUSE" launch failures). The static
# runtime (1.0.3, Runtime 20251108) bundles those, so the AppImage launches on a
# stock distro with no extra packages. Becomes the electron-builder v27 default;
# opt-in here. (Caveat: older AppImageLauncher installs can mishandle the static
# runtime - type2-runtime#121 - but stock systems are unaffected.)
toolsets:
  appimage: "1.0.3"
electronVersion: 40.8.0
npmRebuild: false
# Default artifact names: stable and space-free. Spaces (from productName
# "SealGate") become %20 and break electron-updater URLs and GitHub asset
# links. The dmg/nsis blocks above keep their own explicit names.
artifactName: SealGate-${version}-${arch}.${ext}
# Publish to GitHub Releases (public repo -> no runtime token needed). The
# provider/owner/repo are baked into app-update.yml at build time, so the
# installed app resolves updates from GitHub with no feed URL set at runtime
# (see infra/updateManager.ts). Per-build channel + releaseType are set by the
# CI workflows via `-c`:
#   - stable -> channel: latest, releaseType: release  (.github/workflows/release.yml)
#   - demo   -> channel: beta,   releaseType: prerelease (release-demo.yml)
publish:
  provider: github
  owner: Edison-Watch
  repo: app
  channel: latest
